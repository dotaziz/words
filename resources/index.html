<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words Dictionary</title>
  <link href="styles.css" type="text/css" rel="stylesheet" />
</head>

<body>
  <header>
    <button class="history sidebar" tabindex="0">
      <img src="assets/icons/history.svg" width="22px" height="22px" title="history" draggable="false" />
    </button>

    <div class="search-box">
      <input type="text" autofocus spellcheck="true" class="search-input" aria-label="Search" />
      <img src="assets/icons/search.svg" width="25px" height="25px" class="search-icon" />
    </div>

    <button tabindex="0" class="dropdown settings">
      <img src="assets/icons/menu.svg" title="settings" width="24px" draggable="false" />
      <div class="menu">
        <a href="#history" class="menu-item" data-action="history">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            History
          </span>
          <span class="menu-shortcut">Ctrl+H</span>
        </a>
        <a href="#bookmarks" class="menu-item" data-action="bookmarks">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg"
              style="fill-rule: evenodd; clip-rule: evenodd; stroke-linejoin: round; stroke-miterlimit: 2;" width="100%"
              height="100%" viewBox="0 0 16 16" xml:space="preserve">
              <path style="fill: currentColor" class="ColorScheme-Text"
                d="M4,0c0,0 -1,0 -1,1l0,14l5,-3l5,3l0,-14c0,0 0,-1 -1,-1l-8,0Zm8,13.234l0,-12.17l-0.011,-0.064l-7.925,0l-0.064,0.011l0,12.223l3.486,-2.091c0.316,-0.191 0.712,-0.191 1.028,0l3.486,2.091Z" />
            </svg>
            Bookmarks
          </span>
          <span class="menu-shortcut">Ctrl+B</span>
        </a>
        <a href="#random" class="menu-item" data-action="random">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5"></path>
              <path d="M4 20L21 3"></path>
              <path d="M21 16v5h-5"></path>
              <path d="M15 15l6 6"></path>
              <path d="M4 4l5 5"></path>
            </svg>
            Random Word
          </span>
          <span class="menu-shortcut">Ctrl+R</span>
        </a>
        <a href="#darkmode" class="menu-item" data-action="darkmode">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            Dark Mode
          </span>
          <span class="menu-shortcut">Ctrl+D</span>
        </a>
        <a href="#stats" class="menu-item" data-action="stats">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10"></path>
              <path d="M12 20V4"></path>
              <path d="M6 20v-6"></path>
            </svg>
            Stats
          </span>
          <span class="menu-shortcut">Ctrl+S</span>
        </a>
        <a href="#settings" class="menu-item" data-action="settings">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
            Settings
          </span>
        </a>
        <a href="#about" class="menu-item" data-action="about">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="8"></line>
            </svg>
            About
          </span>
        </a>
        <a href="#exit" class="menu-item" data-action="exit" id="exit-btn">
          <span class="menu-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Exit
          </span>
          <span class="menu-shortcut">Ctrl+Q</span>
        </a>
      </div>
    </button>
  </header>

  <!-- Side Panel -->
  <div class="side-panel" id="side-panel">
    <div class="side-panel-header">
      <h3 id="side-panel-title">History</h3>
      <button class="side-panel-close">&times;</button>
    </div>
    <div class="side-panel-content" id="side-panel-content"></div>
    <div class="side-panel-footer" id="side-panel-footer"></div>
  </div>
  <div class="overlay" id="overlay"></div>

  <!-- Source Tabs (Apple Dictionary Style) -->
  <div class="source-tabs">
    <button class="source-tab active" data-source="all">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      All
    </button>
    <button class="source-tab" data-source="dictionary">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      Dictionary
    </button>
    <button class="source-tab" data-source="online">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
      </svg>
      Online
    </button>
    <button class="source-tab" data-source="wikipedia">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="tab-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      Wikipedia
    </button>
  </div>

  <!-- Results Container -->
  <div class="results-wrapper">
    <div class="container"></div>
    <div class="message">
      <img src="assets/icons/icon.svg" id="info" draggable="false" height="200" width="200" />
      <img src="assets/icons/search.svg" id="not-found" hidden draggable="false" height="200" width="200" />
      <div>Look up definitions of any english term.</div>
    </div>
  </div>

  <!-- Neutralino.js -->
  <script src="js/neutralino.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
